<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: #09090b;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .bg-gradient {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
        }
        .content {
            position: relative;
            text-align: center;
            z-index: 1;
        }
        .badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }
        .title {
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }
        .subtitle {
            font-size: 1.75rem;
            color: #a1a1aa;
            font-weight: 700;
        }
        .cards {
            display: flex;
            gap: 1rem;
            margin-top: 2.5rem;
        }
        .card {
            padding: 0.75rem 1.5rem;
            background: #1c1c21;
            border: 1px solid #27272a;
            border-radius: 10px;
            color: #fafafa;
            font-size: 1rem;
            font-weight: 700;
        }
        .card.learn { border-top: 3px solid #a855f7; }
        .card.misc { border-top: 3px solid #3b82f6; }
        .card.video { border-top: 3px solid #f97316; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="content">
        <div class="badge">FREE RESOURCES</div>
        <div class="title">WebPrompts</div>
        <div class="subtitle">AI Courses, Prompts & Workflows</div>
        <div class="cards">
            <div class="card learn">Learn</div>
            <div class="card misc">Misc</div>
            <div class="card video">Video</div>
        </div>
    </div>
</body>
</html>
